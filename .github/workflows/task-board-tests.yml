name: Task Board Tests

on:
  push:
    branches:
      - pilot/task-board-baseline
      - sdlc/**
  pull_request:
    branches:
      - pilot/task-board-baseline

permissions:
  contents: read

jobs:
  task-board-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check src/app.js
      - run: node --check src/tasks.js
